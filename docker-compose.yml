# cola-attendance 考勤与排班 - 本地/Demo 一键启动（后端 + MySQL）
# MySQL 首次初始化会自动执行 /docker-entrypoint-initdb.d 下的 SQL（仅在 mysql_data 为空时执行）

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: attendance
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/attendance-db-schema.sql:/docker-entrypoint-initdb.d/10-attendance-db-schema.sql:ro
      - ./docs/attendance-db-schema-alter.sql:/docker-entrypoint-initdb.d/20-attendance-db-schema-alter.sql:ro
      - ./attendance-backend/src/main/resources/sql/init-admin.sql:/docker-entrypoint-initdb.d/30-init-admin.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./attendance-backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:-please-change-this-in-production-min-32-chars}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/attendance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
