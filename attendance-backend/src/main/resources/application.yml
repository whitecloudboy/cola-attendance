spring:
  profiles:
    active: dev   # 本地默认用 dev；生产可改为 --spring.profiles.active=prod 并单独配置
  application:
    name: attendance-backend
  datasource:
    url: jdbc:mysql://localhost:3306/attendance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ''  # 无密码留空；有密码请在 application-dev.yml 中配置并启动时加 --spring.profiles.active=dev
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT（生产请用环境变量或配置中心）
jwt:
  secret: attendance-backend-jwt-secret-key-change-in-production
  expiration-ms: 86400000

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
