spring:
  profiles:
    active: dev   # 本地默认用 dev；生产可改为 --spring.profiles.active=prod 并单独配置
  application:
    name: attendance-backend
  datasource:
    url: jdbc:mysql://localhost:3306/attendance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ''  # 无密码留空；有密码请在 application-dev.yml 中配置并启动时加 --spring.profiles.active=dev
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT（生产请用环境变量或配置中心）
jwt:
  secret: attendance-backend-jwt-secret-key-change-in-production
  expiration-ms: 86400000

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 考勤配置（attendance-optimal-design 统一入口）
attendance:
  schedule:
    generate-empty-cron: "0 0 1 * * ?"   # 每日 1:00 生成空考勤
    end-task-cron: "0 55 23 * * ?"       # 每日 23:55 日终补录
  rule-engine:
    enabled: true
    parallel: false   # false 时 RuleOutcomeHandler 落库 attendance_result
    dsl:
      enabled: true
      startRules:
        # 有打卡 且 迟到≤5分钟 视为正常（minutesLate: 0=准时 负=提前 正=迟到分钟）
        - name: normal-start
          when: "#ban != null and #records != null and !#records.isEmpty() and minutesLate() <= 5"
          startStatus: 1
          stop: true
        # 有打卡 且 迟到>5分钟 视为迟到
        - name: late-start
          when: "#ban != null and #records != null and !#records.isEmpty() and minutesLate() > 5"
          startStatus: 2
          stop: true
        # 无打卡 视为缺卡
        - name: no-record-start
          when: "#ban != null and (#records == null || #records.isEmpty())"
          startStatus: 3
          stop: true
      endRules:
        # 有打卡 且 早退≤5分钟或延后 视为正常（minutesEarlyLeave: ≤0=准时/延后 >0=早退分钟）
        - name: normal-end
          when: "#ban != null and #records != null and !#records.isEmpty() and minutesEarlyLeave() <= 5"
          endStatus: 1
          stop: true
        # 有打卡 且 早退>5分钟 视为早退
        - name: early-leave-end
          when: "#ban != null and #records != null and !#records.isEmpty() and minutesEarlyLeave() > 5"
          endStatus: 4
          stop: true
        # 无打卡 视为缺卡
        - name: no-record-end
          when: "#ban != null and (#records == null || #records.isEmpty())"
          endStatus: 3
          stop: true
